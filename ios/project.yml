name: Wofins
options:
  bundleIdPrefix: id.wofins
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  BASE_CONFIGURATION_REFERENCE: ""
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
schemes:
  Wofins:
    build:
      targets:
        Wofins: all
        WofinsTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Wofins/StoreKit/Products.storekit
    test:
      config: Debug
      targets:
        - WofinsTests
    archive:
      config: Release
targets:
  Wofins:
    type: application
    platform: iOS
    sources:
      - path: Wofins
        excludes:
          - "**/.DS_Store"
          - Info.plist
          - Info-Debug.plist
          - Features/Home/HomeView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.wofins.app
        PRODUCT_NAME: Wofins
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "7"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_ENTITLEMENTS: Wofins/Wofins.entitlements
        INFOPLIST_FILE: Wofins/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: LHH9LVRYVY
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        # Harus client tipe iOS (bukan Web) — Web memicu Error 400: custom scheme not allowed
        GID_CLIENT_ID: "408651692876-vea73ugad9mapivcldjfrc4hmd3tirv0.apps.googleusercontent.com"
        GID_SERVER_CLIENT_ID: "408651692876-ju4su29c4t3l08ee9kjajdmavkr0afj1.apps.googleusercontent.com"
      configs:
        Debug:
          BASE_URL: "http://127.0.0.1:8000"
          DEVICE_BASE_URL: ""
          INFOPLIST_FILE: Wofins/Info-Debug.plist
          ENABLE_TESTABILITY: YES
          ENABLE_USER_SCRIPT_SANDBOXING: NO
          # Server lokal: aud idToken = Web Debug client
          GID_SERVER_CLIENT_ID: "408651692876-pp16jkl7kdtdjh9g2htnu89amv05kjmr.apps.googleusercontent.com"
        Release:
          BASE_URL: "https://app.wofins.id"
          INFOPLIST_FILE: Wofins/Info.plist
          # Web Production — idToken aud untuk verifikasi server
          GID_SERVER_CLIENT_ID: "408651692876-ju4su29c4t3l08ee9kjajdmavkr0afj1.apps.googleusercontent.com"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    postCompileScripts:
      - name: Inject Debug device API URL
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "${SRCROOT}/scripts/inject-device-base-url.sh"
    postbuildScripts:
      - name: Inject Debug device API URL (app plist)
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "${SRCROOT}/scripts/inject-device-base-url.sh"
  WofinsTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.wofins.app.tests
        GENERATE_INFOPLIST_FILE: true
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: LHH9LVRYVY
        CODE_SIGN_STYLE: Automatic
    sources:
      - path: WofinsTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Wofins
