name: Wofins
options:
  bundleIdPrefix: id.wofins
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  BASE_CONFIGURATION_REFERENCE: ""
  BASE_URL: "http://127.0.0.1:8000"
schemes:
  Wofins:
    build:
      targets:
        Wofins: all
    run:
      config: Debug
      # Simulator default — pilih device/simulator di Xcode toolbar
    archive:
      config: Release
targets:
  Wofins:
    type: application
    platform: iOS
    sources:
      - path: Wofins
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.wofins.app
        PRODUCT_NAME: Wofins
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Wofins/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Team dari Apple Development identity di Mac ini
        DEVELOPMENT_TEAM: R776QJ2P94
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        BASE_URL: "http://127.0.0.1:8000"
      configs:
        Debug:
          # Device fisik mengabaikan loopback di APIConfig.swift; nilai ini untuk Simulator.
          BASE_URL: "http://127.0.0.1:8000"
        Release:
          BASE_URL: "https://wofins.id"
    info:
      path: Wofins/Info.plist
      properties:
        CFBundleDisplayName: Wofins
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.1.3":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: Wofins perlu akses jaringan lokal untuk terhubung ke server development di Mac Anda.
        NSCameraUsageDescription: WOFINS membutuhkan kamera untuk foto bukti absensi.
        NSLocationWhenInUseUsageDescription: WOFINS membutuhkan lokasi untuk memastikan absensi dilakukan di area kantor.
        NSFaceIDUsageDescription: WOFINS memakai Face ID untuk masuk kembali dengan aman.
        BASE_URL: "$(BASE_URL)"
